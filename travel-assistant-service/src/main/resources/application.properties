spring.application.name=travel-assistant-service

server.port=8085
# Keep Tomcat work files inside the service (not the shared OS temp folder),
# so running as a different user or as admin cannot cause ownership errors.
server.tomcat.basedir=target/tomcat

# Set GEMINI_API_KEY, or put gemini.api.key=... in application-local.properties
# next to pom.xml (gitignored; see application-local.properties.example).
spring.config.import=optional:file:./application-local.properties
gemini.api.key=${GEMINI_API_KEY}


spring.datasource.url=jdbc:h2:mem:cataloguedb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true