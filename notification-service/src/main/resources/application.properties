spring.application.name=notification-service

server.port=8084
# Keep Tomcat work files inside the service (not the shared OS temp folder),
# so running as a different user or as admin cannot cause ownership errors.
server.tomcat.basedir=target/tomcat

spring.datasource.url=jdbc:h2:file:./data/notificationdb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.cloud.stream.kafka.binder.brokers=localhost:9092

spring.cloud.function.definition=bookingConfirmed;bookingFailed

spring.cloud.stream.bindings.bookingConfirmed-in-0.destination=booking-confirmed
spring.cloud.stream.bindings.bookingConfirmed-in-0.group=notification-service
spring.cloud.stream.bindings.bookingConfirmed-in-0.content-type=application/json

spring.cloud.stream.bindings.bookingFailed-in-0.destination=booking-failed
spring.cloud.stream.bindings.bookingFailed-in-0.group=notification-service
spring.cloud.stream.bindings.bookingFailed-in-0.content-type=application/json